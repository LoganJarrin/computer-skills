<!DOCTYPE html>

<link href="https://fonts.googleapis.com/css2?family=Mitr:wght@400;500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<div class="wrap">
  <div id="home" class="screen active">

      <span class="intro-mascot">💬</span>
      <div class="intro-title"></div>
      <div class="intro-sub"></div>
    </div>
    <div class="ch-list" id="chList"></div>
    <div class="home-foot">กดที่บทเรียนเพื่อเริ่ม · มีปุ่ม 🔊 ให้กดฟังเสียงทุกข้อความ<br><a href="index.html">← กลับหน้าแรก</a></div>
  </div>

  <div id="lesson" class="screen">
    <div class="dc-header" id="dcHeader"></div>
    <div class="hud">
      <button class="back-btn" onclick="goHome()" title="กลับ">←</button>
      <div class="hud-title" id="hudTitle">บทเรียน</div>
      <div class="hud-score" id="scoreDisp">⭐ 0</div>

    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="btnNext" onclick="nextSlide()">ต่อไป →</button>
  </div>

  <div id="results" class="screen">
    <div class="res-card">
      <span class="res-icon" id="resTrophy">🏆</span>

      <div class="res-sub" id="resSub">น้องเรียนจบบทนี้แล้ว</div>

        <div class="rs"><div class="rs-val" id="rsStars">⭐⭐⭐</div><div class="rs-lbl">ดาว</div></div>
      </div>
      <div class="res-btns">

        <button class="btn-ghost" onclick="goHome()">กลับเมนูบทเรียน</button>
